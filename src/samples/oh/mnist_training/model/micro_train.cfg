[micro_param]
enable_micro=true
target=RISCV
support_parallel=false

[common_quant_param]
quant_type=FULL_QUANT
bit_num=8

[data_preprocess_param]
calibrate_path=input:data/train_data/bin
calibrate_size=50
input_type=BIN

[full_quant_param]
activation_quant_method=MAX_MIN
bias_correction=true
enable_all_ops=true

[train]
trainMode=Quant
loss=SoftmaxCrossEntropy
labelTensorName=label
optimizer=SGDWithMomentum
learningRate=0.005
momentum=0.9
batchSize=1
