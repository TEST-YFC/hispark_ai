[micro_param]
enable_micro=true
target=RISCV
support_parallel=false

[common_quant_param]
quant_type=FULL_QUANT
bit_num=8

[data_preprocess_param]
calibrate_path=input:data/calib_data/bin
calibrate_size=500
input_type=BIN

[full_quant_param]
activation_quant_method=MAX_MIN
bias_correction=true
enable_all_ops=true

[train]
train_mode=qas_int8
loss=softmax_cross_entropy
label_tensor_name=label
optimizer=sgd_with_momentum
learning_rate=0.0003
momentum=0.9
batch_size=1
