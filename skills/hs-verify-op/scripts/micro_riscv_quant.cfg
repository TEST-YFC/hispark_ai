[micro_param]
enable_micro=true
target=RISCV
support_parallel=false

[common_quant_param]
quant_type=FULL_QUANT
bit_num=8

[data_preprocess_param]
# {CALIBRATE_PATH} is filled by run_all_cases.py with one entry PER model input:
#   name0:calibDir0,name1:calibDir1,...   (each input has its own calibration folder)
# calibrate_size is the number of calibration SAMPLES per input, not the input count.
calibrate_path={CALIBRATE_PATH}
calibrate_size=1
input_type=BIN

[full_quant_param]
activation_quant_method=MAX_MIN
bias_correction=true
enable_all_ops=true
